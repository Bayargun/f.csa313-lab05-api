$kind: http-request
url: "{{baseUrl}}/registrations"
method: POST
body:
  type: json
  content: |-
    {
        "studentID": "s5",
        "courseID": "cs105"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("TC05 - Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("TC05 - Prerequisites error", function () {
          pm.expect(pm.response.json().result)
            .to.eql("ERROR_PREREQUISITES");
      });

      pm.test("TC05 - Missing CS201", function () {
          pm.expect(pm.response.json().missing)
            .to.deep.equal(["CS201"]);
      });
