    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("TC07 - Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("TC07 - Prerequisites error", function () {
          pm.expect(pm.response.json().result)
            .to.eql("ERROR_PREREQUISITES");
      });

      pm.test("TC07 - Missing CS202", function () {
          pm.expect(pm.response.json().missing)
            .to.deep.equal(["CS202"]);
      });
